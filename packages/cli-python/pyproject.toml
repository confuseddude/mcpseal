[project]
name = "mcpseal"
version = "0.1.1"
description = "mcpseal CLI (Python) - MCP tool-integrity verifier"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "canonicaljson>=2.0.0",
    # build-bible.md Part 6.2 / CLAUDE.md invariant 6: OS keychain storage
    # for secrets (mirrors cli-node's @napi-rs/keyring). `keyring` is the
    # standard, actively-maintained cross-platform Python library for this
    # (Windows Credential Manager / macOS Keychain / Linux Secret Service).
    "keyring>=25.0.0",
    # CLAUDE.md: "never hand-rolled crypto... well-known, maintained
    # libraries only." pyca/cryptography for ed25519 sign/verify — the
    # de facto standard Python crypto library, equivalent in trust level
    # to @noble/curves on the TS side.
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
mcpseal = "mcpseal.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
