name: Cross-language hash parity

# build-bible.md Part 13: a single whitespace or key-order difference between
# the Node and Python canonical JSON silently produces different hashes and
# thus false-positive blocks. This gate — both languages' test suites
# asserting against the shared test-vectors/hash-fixtures.json — exists
# solely to catch that. Never skip it (Part 13, CLAUDE.md invariant 4).

on:
  push:
  pull_request:

jobs:
  ts:
    name: cli-core / shared-types (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mcpseal/shared-types build
      - run: pnpm --filter @mcpseal/cli-core build
      - run: pnpm --filter @mcpseal/cli-core test
      - run: pnpm --filter @mcpseal/shared-types test

  # cli-node's own suite (cli.ts, doctor.ts, login.ts, the integration tests
  # against the real compiled binary) was previously only run as a publish
  # gate, which meant a broken cli.ts could pass CI on every ordinary push
  # and only surface at release time. It runs on push/PR now.
  cli-node:
    name: cli-node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mcpseal/shared-types build
      - run: pnpm --filter @mcpseal/cli-core build
      - run: pnpm --filter mcpseal build
      - run: pnpm --filter mcpseal test

  # A real OS matrix. The proxy spawned MCP servers incorrectly on POSIX for
  # several releases while every Windows test passed, because the Python
  # suite had only ever run on Windows locally and its Linux failures were
  # being skipped on CI. Non-keychain tests now run on all three platforms;
  # the 19 real-OS-keychain tests still skip when CI=true (no Secret Service
  # on a headless runner) — see CHECKLIST.md section 2.
  cli-python:
    name: cli-python (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
        include:
          # Test the floor we actually advertise in pyproject.toml, not just
          # whatever version is convenient.
          - os: ubuntu-latest
            python-version: "3.10"
    defaults:
      run:
        working-directory: packages/cli-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" pytest-timeout
      # --timeout is load-bearing: a blocking read with no timeout once
      # stalled this job for over two hours, and a hang is indistinguishable
      # from a slow test until it's too late to tell.
      - run: pytest -q --timeout=120 --timeout-method=thread -rf

  # Test the floor cli-node's `engines` field actually advertises.
  #
  # This job originally targeted Node 18 and immediately proved the claim
  # false: @noble/curves@2 requires Node >=20.19.0, so `npx mcpseal` on
  # Node 18 emits EBADENGINE and runs only by luck -- with the crypto
  # library's own supported-version guarantee void on exactly the
  # signature-verification path that matters most here. Node 18 also went
  # EOL in April 2025. `engines` was corrected to >=20.19.0 rather than
  # pinning an older crypto library to prop up an EOL runtime.
  node-floor:
    name: cli-node on Node 20.19 (advertised floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mcpseal/shared-types build
      - run: pnpm --filter @mcpseal/cli-core build
      - run: pnpm --filter mcpseal build
      - run: pnpm --filter mcpseal test

  # No hard threshold gate yet -- the point is to be able to SEE what's
  # untested rather than guess. Runs on Linux only; coverage doesn't vary
  # by platform enough to justify three times the minutes.
  coverage:
    name: coverage (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mcpseal/shared-types build
      - run: pnpm --filter @mcpseal/cli-core build
      - run: pnpm --filter @mcpseal/cli-core test -- --coverage
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" pytest-cov pytest-timeout
        working-directory: packages/cli-python
      - run: pytest -q --timeout=120 --cov=mcpseal --cov-report=term-missing
        working-directory: packages/cli-python

  # Cheap and high-value for a tool whose entire pitch is supply-chain
  # integrity: two runtime deps on the Node side, three on Python.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      # Audit ONLY what actually ships to users.
      #
      # A workspace-wide `pnpm audit` fails on 6 vulnerabilities that all
      # come from apps/dashboard's tree (sharp -> libvips). That is Track
      # B, unpublished, and not something an `npx mcpseal` user ever
      # installs -- gating CLI releases on it would train everyone to
      # ignore a red audit, which is worse than not running one. The
      # shipped runtime surface is tiny (two deps), so audit exactly that
      # via a synthetic manifest.
      - name: Audit cli-node's shipped runtime dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/audit-shim
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('packages/cli-node/package.json', 'utf8'));
            fs.writeFileSync('/tmp/audit-shim/package.json', JSON.stringify({
              name: 'mcpseal-audit-shim', version: '1.0.0', private: true,
              dependencies: pkg.dependencies
            }, null, 2));
            console.log('auditing:', JSON.stringify(pkg.dependencies));
          "
          cd /tmp/audit-shim
          npm install --package-lock-only --no-audit --no-fund
          npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # setuptools is build tooling rather than a mcpseal runtime
      # dependency, but PYSEC-2026-3447 is specifically about MANIFEST.in
      # exclusions silently failing so that files land in a published
      # sdist -- and publishing sdists is exactly what this project does.
      # We ship no MANIFEST.in today, so the bypass isn't reachable here,
      # but upgrading is free and beats teaching ourselves to wave away a
      # red audit. Keep this in step with publish.yml's build job.
      - run: python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
      - run: pip install pip-audit
      - run: pip-audit --desc
        working-directory: packages/cli-python
