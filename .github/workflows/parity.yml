name: Cross-language hash parity

# build-bible.md Part 13: a single whitespace or key-order difference between
# the Node and Python canonical JSON silently produces different hashes and
# thus false-positive blocks. This gate — both languages' test suites
# asserting against the shared test-vectors/hash-fixtures.json — exists
# solely to catch that. Never skip it (Part 13, CLAUDE.md invariant 4).

on:
  push:
  pull_request:

jobs:
  ts:
    name: cli-core / shared-types (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mcpseal/shared-types build
      - run: pnpm --filter @mcpseal/cli-core build
      - run: pnpm --filter @mcpseal/cli-core test
      - run: pnpm --filter @mcpseal/shared-types test

  python:
    name: cli-python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # Real OS keychain integration (test_keychain.py, test_login.py,
      # test_machine_identity.py, test_ship_events.py) is skipped on CI --
      # emulating a real desktop keychain session (gnome-keyring +
      # SecretStorage) inside an ephemeral, headless container proved
      # unreliable in practice: it both hung indefinitely and produced
      # spurious failures partway through, on tests that pass instantly
      # on a real OS. See CHECKLIST.md. Covered by manual verification
      # across real OSes before each release instead.
      - run: pytest -q
