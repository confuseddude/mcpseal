name: Publish

# Fires only on a version tag push (e.g. v0.1.2), so a normal push to
# master never accidentally publishes. Uses OIDC-based Trusted Publishing
# for both npm and PyPI (id-token: write) -- no long-lived publish token
# is stored anywhere for this to work. See CHECKLIST.md for the one-time
# npm/PyPI Trusted Publisher configuration this depends on.

on:
  push:
    tags:
      - "v*"

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # mcpseal (cli-node) depends on the private workspace packages
      # @mcpseal/cli-core and @mcpseal/shared-types at build/type-check
      # time -- `pnpm --filter mcpseal build` alone doesn't build its
      # workspace deps first, same order parity.yml's ts job already uses.
      - run: pnpm --filter @mcpseal/shared-types build
      - run: pnpm --filter @mcpseal/cli-core build
      - run: pnpm --filter mcpseal build
      - run: pnpm --filter mcpseal test
      - run: npm publish --provenance --access public
        working-directory: packages/cli-node

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/cli-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" build
      # ubuntu-latest has no Secret Service / D-Bus session by default, so
      # `keyring` (used by test_keychain.py's real-OS-keychain test) has
      # nothing to talk to and hangs instead of failing fast. Give it one.
      - name: Install a Secret Service backend for keyring tests
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: Run tests inside a real D-Bus session with keyring unlocked
        # gnome-keyring-daemon --unlock without --daemonize runs in the
        # foreground and never returns, so this MUST daemonize and eval
        # its own exported env vars (GNOME_KEYRING_CONTROL etc), not just
        # dbus-launch's -- the previous version hung here indefinitely.
        run: |
          eval "$(dbus-launch --sh-syntax)"
          eval "$(printf '\n' | gnome-keyring-daemon --daemonize --unlock --components=secrets)"
          pytest -q
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/cli-python/dist
