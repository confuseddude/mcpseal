name: Publish

# Fires only on a version tag push (e.g. v0.1.2), so a normal push to
# master never accidentally publishes. Uses OIDC-based Trusted Publishing
# for both npm and PyPI (id-token: write) -- no long-lived publish token
# is stored anywhere for this to work. See CHECKLIST.md for the one-time
# npm/PyPI Trusted Publisher configuration this depends on.

on:
  push:
    tags:
      - "v*"

jobs:
  # Publishing is irreversible: a version number can never be reused on
  # either registry. Check the tag actually matches what the manifests say
  # BEFORE either publish job runs, so a mistyped tag fails in 20 seconds
  # instead of burning a version number.
  verify-version:
    name: Tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag against both manifests
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          npm_version=$(node -p "require('./packages/cli-node/package.json').version")
          py_version=$(grep -m1 '^version' packages/cli-python/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$tag  npm=$npm_version  pypi=$py_version"
          if [ "$tag" != "$npm_version" ] || [ "$tag" != "$py_version" ]; then
            echo "::error::Tag v$tag does not match cli-node ($npm_version) / cli-python ($py_version)."
            exit 1
          fi

  publish-npm:
    needs: verify-version
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - uses: pnpm/action-setup@v4
      # OIDC-based Trusted Publishing registry auth needs npm CLI >=
      # 11.5.1; provenance/attestation signing is an older, separate
      # feature that works fine on whatever setup-node@v4 bundles with
      # node-version 20, which is why the previous attempt's provenance
      # step succeeded (signed + logged to sigstore) but the actual
      # authenticated PUT 404'd -- npm silently treated it as
      # unauthenticated rather than erroring on the OIDC exchange itself.
      # Pinned to the 11.x line, not @latest -- npm 12 raised its own
      # engines requirement to Node >=22.22.2/24.15.0/26, which rejects
      # the install outright on node-version 20 (EBADENGINE). npm
      # 11.5.1+ already has the OIDC fix above and stays Node-20-safe.
      - run: npm install -g npm@^11
      - run: pnpm install --frozen-lockfile
      # mcpseal (cli-node) depends on the private workspace packages
      # @mcpseal/cli-core and @mcpseal/shared-types at build/type-check
      # time -- `pnpm --filter mcpseal build` alone doesn't build its
      # workspace deps first, same order parity.yml's ts job already uses.
      - run: pnpm --filter @mcpseal/shared-types build
      - run: pnpm --filter @mcpseal/cli-core build
      - run: pnpm --filter mcpseal build
      - run: pnpm --filter mcpseal test
      - run: npm publish --provenance --access public
        working-directory: packages/cli-node

  publish-pypi:
    needs: verify-version
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/cli-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" build pytest-timeout
      # Real OS keychain integration (test_keychain.py, test_login.py,
      # test_machine_identity.py, test_ship_events.py) is skipped on CI --
      # a headless runner has no Secret Service. See CHECKLIST.md section 2.
      #
      # --timeout is load-bearing, not decoration: a blocking readline with
      # no timeout once stalled this job for over two hours, and because
      # pytest never reached its summary the 16 real failures behind the
      # hang stayed invisible across five release attempts.
      - run: pytest -q --timeout=120 --timeout-method=thread -rf
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/cli-python/dist
